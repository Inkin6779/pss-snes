<!DOCTYPE html>
<html>
    <head>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
            }
            iframe {
                width: 100%;
                height: 100%;
                border: none;
            }
        </style>
        <title>Embedded Game</title>
    </head>
    <body>
        <!-- Pass the ROM path via the file-name URL parameter -->
        <iframe src="../play.html?file-name=SuperMarioWorld/game.sfc"></iframe>
    </body>
</html>
